version: 2.1

jobs:
  CONST_H_:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Blank dilution for the new team
          command: |
            mkdir -p /tmp/bin-H
            set +o pipefail 2>/dev/null; echo {a..z} | tr -d ' ' > /tmp/bin-H/CPU-lagoon; seq 1 1428020 >> /tmp/bin-H/CPU-lagoon; true
            echo "[✔] produced $(wc -c </tmp/bin-H/CPU-lagoon)"
      - persist_to_workspace:
          root: /tmp/bin-H
          paths:
            - 'CPU-lagoon'
  alpha-v1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/bin-H
      - run:
          name: Load baseline
          command: |
            grep -cE '[A-Za-z]' /tmp/bin-H/CPU-lagoon 2>/dev/null || true
      - run:
          name: Checkout working tree
          command: git clone --depth 1 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore inputs
          command: tar --extract --file=archive-v5.tar
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          command: /bin/sh -c "./thread-edge"
